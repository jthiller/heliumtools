name: Frontend checks

on:
  pull_request:
    paths:
      - "pages/**"
      - ".github/workflows/frontend-checks.yml"
  push:
    branches: [main]
    paths:
      - "pages/**"
      - ".github/workflows/frontend-checks.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pages/public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pages/public/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
